name: pilot-trigger

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '@max-pefi 请修正 README.md 第 32 行的中文引号：`Layer2 上手编排（”装上就跑”入口）` 里两个引号都是右引号（”），第一个应为左引号（“）。',
              '',
              '只改这一处标点，不要动其他内容；改完开 PR，并在本 Issue 里说明改了什么、怎么验证。',
              '',
              '<!-- pilot-trigger: 这条评论由 workflow 代发，代替人手开口。 -->'
            ].join('\n')
            await github.rest.issues.createComment({ owner: 'max-pefi', repo: 'delivery-flow', issue_number: 1, body })
